<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment AI Siswa</title>

    <!-- Memuat mesin AI (ONNX Runtime Web) agar model bisa berjalan langsung di browser -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg,#0f172a,#1e293b,#111827);
            background-size: 400% 400%;
            animation: bgMove 10s ease infinite;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        @keyframes bgMove{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        h1{
            color:#00e5ff;
            text-shadow:
                0 0 10px #00e5ff,
                0 0 20px #00e5ff;
            margin-bottom:5px;
            text-align:center;
        }

        p{
            color:#d1d5db;
            margin-bottom:20px;
            text-align:center;
        }

        .btn-start{
            padding:12px 30px;
            font-size:1.1rem;
            cursor:pointer;
            background:linear-gradient(45deg,#ff3b30,#ff6b6b);
            color:white;
            border:none;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
            box-shadow:0 0 15px rgba(255,59,48,0.5);
        }

        .btn-start:hover{
            transform:translateY(-3px);
            box-shadow:0 0 25px rgba(255,59,48,0.8);
        }

        #status{
            margin:15px;
            padding:12px;
            width:600px;
            text-align:center;
            border-radius:10px;
            font-weight:bold;
            color:#00ff88;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 0 10px rgba(0,255,136,0.2);
        }

        .container{
            position:relative;
            width:640px;
            height:480px;
            border:2px solid #00e5ff;
            border-radius:15px;
            overflow:hidden;
            box-shadow:
                0 0 10px #00e5ff,
                0 0 25px rgba(0,229,255,0.5);
            transition:0.3s;
        }

        .container:hover{
            transform:scale(1.01);
        }

        video,
        canvas#overlay{
            position:absolute;
            top:0;
            left:0;
            width:640px;
            height:480px;
            border-radius:12px;
        }

        canvas#overlay{
            z-index:10;
            pointer-events:none;
        }

        ::-webkit-scrollbar{
            width:10px;
        }

        ::-webkit-scrollbar-track{
            background:#1e293b;
        }

        ::-webkit-scrollbar-thumb{
            background:#00e5ff;
            border-radius:10px;
        }
    </style>
</head>
<body>

    <h1>🛡️ Proyek AI: Deteksi Otomatis</h1>
    <p>Dibuat oleh: Ikmal Chaerul Ihsan, Anurifa, M. Revan Dwiasyah, Ali Rohman, Alif Renza</p>

    <button id="btn-init" class="btn-start">AKTIFKAN KAMERA</button>
    <div id="status">STATUS: MATI</div>

    <div class="container">
        <video id="webcam" playsinline muted></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <canvas id="processor" width="640" height="640" style="display:none;"></canvas>

    <script src="app.js"></script>

</body>
</html>
